<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stochos — model-routing leaderboard</title>
<!-- jsDelivr CDN assets -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.0.18/index.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/index.min.css" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e14;
    --bg2: #12161f;
    --card: #171c28;
    --border: #232a3a;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #6ee7b7;
    --accent2: #60a5fa;
    --gold: #fbbf24;
    --silver: #cbd5e1;
    --bronze: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #1a2235 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { margin-bottom: 2rem; }
  h1 {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub { color: var(--muted); margin-top: 0.4rem; font-size: 0.95rem; }
  .meta { color: var(--muted); font-size: 0.8rem; margin-top: 0.6rem; font-family: "JetBrains Mono", monospace; }
  .tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .tab {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.5rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    font-family: "JetBrains Mono", monospace;
    font-size: 0.8rem;
    transition: all 0.15s;
  }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active { background: var(--card); border-color: var(--accent); color: var(--accent); }
  .panel { display: none; }
  .panel.active { display: block; }
  .best-banner {
    background: linear-gradient(120deg, rgba(110,231,183,0.12), rgba(96,165,250,0.12));
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 1rem 1.2rem;
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .best-banner .crown { font-size: 1.4rem; }
  .best-banner .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .best-banner .model { font-size: 1.2rem; font-weight: 600; }
  .best-banner .ms { color: var(--accent); font-family: "JetBrains Mono", monospace; }
  .row {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.2rem;
    margin-bottom: 0.6rem;
  }
  .rank {
    width: 2rem;
    height: 2rem;
    border-radius: 6px;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .rank.r1 { background: rgba(251,191,36,0.15); color: var(--gold); }
  .rank.r2 { background: rgba(203,213,225,0.12); color: var(--silver); }
  .rank.r3 { background: rgba(217,119,6,0.15); color: var(--bronze); }
  .rank.rn { background: var(--bg2); color: var(--muted); }
  .info { flex: 1; min-width: 0; }
  .model { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane { color: var(--muted); font-size: 0.75rem; font-family: "JetBrains Mono", monospace; }
  .stats { text-align: right; color: var(--muted); font-family: "JetBrains Mono", monospace; font-size: 0.8rem; }
  .stats .ms { color: var(--text); font-size: 0.95rem; }
  .scorebar { height: 3px; background: var(--bg2); border-radius: 2px; margin-top: 0.4rem; overflow: hidden; }
  .scorebar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.75rem; text-align: center; font-family: "JetBrains Mono", monospace; }
  footer a { color: var(--accent); text-decoration: none; }
  @media (max-width: 600px) {
    h1 { font-size: 1.8rem; }
    .row { flex-wrap: wrap; }
    .stats { text-align: left; width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>stochos · model-routing leaderboard</h1>
    <div class="sub">Per-model-per-provider-per-router benchmark — fastest correct model per prompt type.</div>
    <div class="meta" id="meta"></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
  <footer>
    nightly benchmark · <a href="https://github.com/toxicwind/stochos">toxicwind/stochos</a> ·
    data driven by the <a href="https://github.com/toxicwind/stochos/blob/main/src/algo.ts">selection algorithm</a>
  </footer>
</div>
<script>
async function init() {
  const res = await fetch("./leaderboard.json");
  const data = await res.json();
  document.getElementById("meta").textContent =
    `generated ${new Date(data.generatedAt).toLocaleString()} · ${data.benchmark}`;
  const tabs = document.getElementById("tabs");
  const panels = document.getElementById("panels");
  const prompts = Object.entries(data.prompts);
  prompts.forEach(([name, p], i) => {
    const tab = document.createElement("button");
    tab.className = "tab" + (i === 0 ? " active" : "");
    tab.textContent = name;
    tab.onclick = () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      panels.children[i].classList.add("active");
    };
    tabs.appendChild(tab);

    const panel = document.createElement("div");
    panel.className = "panel" + (i === 0 ? " active" : "");
    const b = p.best;
    if (b) {
      const banner = document.createElement("div");
      banner.className = "best-banner";
      banner.innerHTML = `<span class="crown">👑</span><div><div class="label">best</div><div class="model">${escapeHtml(b.model)}</div></div><div style="flex:1"></div><div class="ms">${b.ms}ms · ${b.textLen}c · score ${b.score}</div>`;
      panel.appendChild(banner);
    }
    p.ranked.forEach((c, idx) => {
      const row = document.createElement("div");
      row.className = "row";
      const rank = idx === 0 ? "r1" : idx === 1 ? "r2" : idx === 2 ? "r3" : "rn";
      row.innerHTML = `
        <div class="rank ${rank}">${idx + 1}</div>
        <div class="info">
          <div class="model">${escapeHtml(c.model)}</div>
          <div class="lane">${escapeHtml(c.lane)}</div>
          <div class="scorebar"><div style="width:${Math.max(4, c.score * 100)}%"></div></div>
        </div>
        <div class="stats"><div class="ms">${c.ms}ms</div>${c.textLen}c · ${c.score}</div>`;
      panel.appendChild(row);
    });
    panels.appendChild(panel);
  });
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
init();
</script>
</body>
</html>
